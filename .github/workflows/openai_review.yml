name: OpenAI code review

on:
  pull_request:
    types: [opened]

jobs:
  review_code:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Get PR diff
        run: |
          gh pr diff ${{ github.event.pull_request.number }} > diff.txt
          cat diff.txt
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

#      - name: Send code to OpenAI for review
#        run: |
#          DIFF_CONTENT=$(jq -Rs '.' < diff.txt) # Convert file to a JSON-safe string
#          JSON_PAYLOAD=$(jq -n --arg content "$DIFF_CONTENT" \
#            '{model: "gpt-4o-mini-2024-07-18", messages: [{role: "system", content: "Review the following code diff adn suggest improvements, detect error or bad practises. Return your review in markdown format."}, {role: "user", content: $content}]}')
#          RESPONSE=$(curl -X POST "https://api.openai.com/v1/chat/completions" \
#            -H "Authorization: Bearer ${{ secrets.OPEN_API_KEY }}" \
#            -H "Content-Type: application/json" \
#            -d "$JSON_PAYLOAD")
#          # echo "$RESPONSE" > review.txt
#          echo "$RESPONSE" |jq -r '.choices[0].message.content' > review.txt

      - name: Send code to OpenAI for review
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          # Zbuduj JSON\_payload bezpośrednio z pliku `diff.txt` (jq zadba o escape)
          JSON_PAYLOAD=$(jq -Rs \
            --arg model "gpt-4o-mini-2024-07-18" \
            --arg system "Review the following code diff and suggest improvements, detect errors or bad practices. Return your review in markdown format." \
            '{model: $model, messages: [{role: "system", content: $system}, {role: "user", content: .}]}' < diff.txt)
      
          # Wyślij żądanie (poprawny nagłówek -H i poprawna zmienna środowiskowa)
          RESPONSE=$(curl -s -X POST "https://api.openai.com/v1/chat/completions" \
            -H "Authorization: Bearer ${OPENAI_API_KEY}" \
            -H "Content-Type: application/json" \
            --data-binary "$JSON_PAYLOAD")
      
          echo "$RESPONSE" | jq -r '.choices[0].message.content' > review.txt
      

      - name: Post review as comment
        run: |
          gh pr comment ${{ github.event.pull_request.number }} --body-file review.txt
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
